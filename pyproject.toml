[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ptbundle"
version = "0.1.0"
description = "Transparent, auditable, plain-text serialization format for Git bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ptbundle = "ptbundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptbundle = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0",
    "pytest-bdd>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=ptbundle",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["ptbundle"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["ptbundle"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
